# Copied from the CommanderSID project (software/sid-tunes/psid.cfg, commit 03007ec).
# PSID file: the 124-byte v2 header, then the tune's code at $1000 (load address in the header)
MEMORY {
    HDR:  start = $0000, size = $007C, file = %O, fill = yes;
    MAIN: start = $1000, size = $1000, file = %O;
}
SEGMENTS {
    HEADER: load = HDR,  type = ro;
    CODE:   load = MAIN, type = rw;
}
